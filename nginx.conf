server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # DNS interne de Docker : permet de re-résoudre "backend" après un redéploiement
  # (sinon nginx garderait l'ancienne adresse IP et renverrait des erreurs 502).
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Ne pas divulguer la version de nginx
  server_tokens off;
  client_max_body_size 1m;

  # En-têtes de sécurité (hérités par /healthz, /api/ et /)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  # CSP : scripts et API uniquement depuis notre propre origine. 'unsafe-inline' est limité aux styles,
  # car React pose des attributs style= ; aucun script inline n'est autorisé.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  # À activer uniquement si le site est servi en HTTPS :
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Santé du conteneur frontend (HEALTHCHECK Docker et vérification post-déploiement)
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # /api/xxx  ->  http://backend:5000/api/xxx   (les routes Flask sont préfixées /api)
  # Si votre backend n'utilise pas ce préfixe, ajoutez ici : rewrite ^/api/(.*)$ /$1 break;
  location /api/ {
    set $backend http://backend:5000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
  }

  # Fichiers générés par Vite (nom avec empreinte : cache longue durée)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  # Application monopage : toute autre route renvoie index.html
  location / {
    try_files $uri /index.html;
  }
}
